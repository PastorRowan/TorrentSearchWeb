            for (const tracker of trackers) {

        function formatFileSize(bytes) {
            const units = ["B", "KB", "MB", "GB", "TB"];

            let unitIndex = 0;
            let size = Number(bytes);

            while (size >= 1024 && unitIndex < units.length - 1) {
                size /= 1024;
                unitIndex++;
            }

            const decimals = unitIndex === 0 ? 0 : 2;

            return `${size.toFixed(decimals)} ${units[unitIndex]}`;

        let isSearching = false;

        searchBar.addEventListener("keydown", async (event) => {
            if (
                event.key == "Enter" &&
                !isSearching &&
                trackers.length >= 1
            ) {
                isSearching = true;
                const query = searchBar.value;
                const searches = [
                    // pirate bay search
                    async function(query) {
                        try {
                            const url = `https://apibay.org/q.php?q=${query}`;
                            const options = {
                                "method": "GET",
                                "Accept": "application/json"
                            };
                            const response = await fetch(url, options);
                            if (!response.ok) {
                                console.error(`Failed to get 'The Pirate Bay' search results\nurl: '${url}'\nresponse.status: '${response.status}'`);
                                return [];
                            };
                            const results = await response.json();
                            if (!Array.isArray(results)) {
                                console.error(`Error: the pirate bay results was not an array\nresults: '${results}'`);
                                return [];
                            };
                            const searchResults = [];
                            results.forEach((result) => {
                                if (
                                    result != null &&
                                    typeof result == "object" &&
                                    typeof result?.name == "string" &&
                                    typeof result?.info_hash == "string" &&
                                    typeof result?.size == "string" &&
                                    typeof result?.leechers == "string" &&
                                    typeof result?.seeders == "string"
                                ) {
                                    searchResults.push({
                                        name: result.name,
                                        infoHash: result.info_hash,
                                        size: result.size,
                                        leechers: result.leechers,
                                        seeders: result.seeders
                                    });
                                };
                            });
                            return searchResults;
                        } catch (error) {
                            console.error(`Failed to get 'The Pirate Bay' search results: ${error}`);
                            return [];
                        };
                    }
                ];
                const searchPromises = searches.map((search) => {
                    return search(query);
                });
                const allSearchResults = (await Promise.all(searchPromises)).flat(1);
                resultsTableBody.replaceChildren();
                allSearchResults.forEach((searchResult) => {

                    const row = resultsTableBody.insertRow();

                    row.addEventListener("click", () => {
                        openMagnetUrl(
                            createMagnetUrl(searchResult.infoHash)
                        );
                        /*

                    });

                    const nameCell = row.insertCell();
                    nameCell.textContent = searchResult.name;

                    const sizeCell = row.insertCell();

            };
        });
